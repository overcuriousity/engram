<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}engram{% endblock %}</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="engram">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/htmx.min.js" defer></script>
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <div class="shell">
    {% block nav %}
    <nav class="top">
      <a href="/ui/search" class="brand" aria-label="engram">
        <img src="/assets/logo.svg" alt="" width="22" height="22">
        <span>engram</span>
      </a>
      <a href="/ui/capture">Capture</a>
      <a href="/ui/search">Search</a>
      <a href="/ui/ask">Ask</a>
      <span class="spacer"></span>
      <form method="post" action="/auth/logout" style="display:inline">
        <button class="btn btn-ghost btn-sm" type="submit">Sign out</button>
      </form>
    </nav>
    {% endblock %}
    {% block content %}{% endblock %}
  </div>
  <nav class="tabbar" aria-label="Sections">
    <a href="/ui/capture">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>Capture</a>
    <a href="/ui/search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg>Search</a>
    <a href="/ui/ask">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 7.5a3 3 0 115 2.2c-.8.7-1.2 1.2-1.2 2.3M10 15.5v.01"/></svg>Ask</a>
  </nav>
</body>
</html>
