{# A slot that is always present, so `_held.html` can swap the button in once the base holds something. app.js lends the primary style to the likelier verb. #}
<span id="ask-verb-slot"{% if oob %} hx-swap-oob="true"{% endif %}>
  {%- if ask_enabled && held -%}
  <button class="oc-btn" type="button" data-verb="ask" disabled
          title="Type or attach something first">Ask</button>
  {%- endif -%}
</span>
