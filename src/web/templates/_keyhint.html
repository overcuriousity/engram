{# Shown by app.js only where there is a keyboard; dismissed once. #}
<span id="keyhint-slot"{% if oob %} hx-swap-oob="true"{% endif %}>
  {%- if held %}
  <p class="keyhint" hidden>
    <kbd>/</kbd> box{% if ask_enabled %} <kbd>Ctrl</kbd><kbd>↵</kbd> ask{% endif %}
    <kbd>Alt</kbd><kbd>↵</kbd> decide
    <kbd>Ctrl</kbd><kbd>⇧</kbd><kbd>↵</kbd> capture
    <kbd>↑</kbd><kbd>↓</kbd> move <kbd>↵</kbd> open
    <kbd>s</kbd> hide source <kbd>r</kbd> reading
    <button type="button" class="oc-btn" data-dismiss-hint>Got it</button>
  </p>
  {%- endif %}
</span>
