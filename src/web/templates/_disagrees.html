{# Under the row, not in it: the row is one link. Said on both notes; neither is picked. #}
{% for d in r.disagrees %}
<div class="muted row-sub disagrees">
  Disagrees with <a href="/ui/artifacts/{{ d.other_id }}">{{ d.other_title }}</a>
  ({{ d.day }}){% if let Some(x) = d.detail %}: {{ x }}{% endif %}
</div>
{% endfor %}
