{% extends "layout.html" %}
{% block title %}Ask — pkdb{% endblock %}
{% block content %}
<p class="muted">Synthesis across several chunks. Slower than search, and never the default path.</p>
<form hx-post="/ui/ask" hx-target="#ask-result" hx-swap="innerHTML" class="row" style="margin-bottom:1rem">
  <input class="input" name="q" placeholder="Ask a question…" autofocus>
  <button class="btn btn-accent" type="submit">Ask</button>
  <span class="spinner">thinking…</span>
</form>
<div id="ask-result"></div>
{% endblock %}
