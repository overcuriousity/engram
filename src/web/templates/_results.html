{% if results.is_empty() %}
  <p class="muted">No matches.</p>
{% else %}
  {% for r in results %}
  <div class="card">
    <div class="card-head">
      <span class="card-title">{{ r.title }}</span>
      <span class="card-meta">{{ r.rank }}</span>
    </div>
    <div class="md">{{ r.html|safe }}</div>
    <div class="chips">
      {% if let Some(c) = r.category %}<span class="badge badge-accent">{{ c }}</span>{% endif %}
      {% for t in r.tags %}<span class="badge">{{ t }}</span>{% endfor %}
      <a class="btn btn-ghost btn-sm" href="/ui/sources/{{ r.source_id }}">source</a>
    </div>
  </div>
  {% endfor %}
{% endif %}
