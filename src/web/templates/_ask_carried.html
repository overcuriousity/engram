{# Swaps itself; the bar follows out of band, since carrying the answer means it was right. #}
<button class="oc-btn" type="button" aria-pressed="{% if carried %}true{% else %}false{% endif %}"
        hx-post="/ui/ask/{{ event_id }}/carried" hx-vals='{"n":{{ n }}}'
        hx-swap="outerHTML">{% if carried %}{{ crate::web::icons::icon("check", 16) }}{% endif %}<span>Carried the answer</span></button>
{% if let Some(bar) = bar %}{{ bar|safe }}{% endif %}
