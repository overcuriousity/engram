{% extends "layout.html" %}
{% block title %}Capture — pkdb{% endblock %}
{% block content %}
<form hx-post="/ui/capture" hx-target="#capture-result" hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.successful) this.reset()" class="stack">
  <input class="input" name="title" placeholder="Optional label">
  <textarea class="textarea" name="text" placeholder="Paste anything worth keeping." autofocus></textarea>
  <div class="row">
    <button class="btn btn-accent" type="submit">Capture</button>
    <span class="spinner">saving…</span>
  </div>
</form>
<div id="capture-result" style="margin-top:1rem"></div>
{% endblock %}
