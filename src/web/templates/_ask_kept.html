{# What became of the answer, in place of the button that kept it. The chips row
   swaps itself, so the answer above stays exactly where it was being read. #}
<div class="chips">
  {% if duplicate %}
    <span class="badge badge-muted" title="This text was already stored, so nothing was processed a second time">already in the base</span>
  {% else if parked %}
    <span class="badge badge-warning"
          title="Stored and processed like any capture. It looks {{ near_dupe_percent }}% like an existing source; the base merges or hides what the two repeat on its own, with an undo on Insights">kept — resembles a source</span>
  {% else %}
    <span class="badge badge-success" title="Stored as a source and queued like any other capture">kept</span>
  {% endif %}
  <a class="btn btn-ghost btn-sm" href="/ui/corpora/{{ id }}">view source</a>
</div>
