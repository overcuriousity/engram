<div class="oc-row answer-keep">
  {% if duplicate %}
    {{ crate::web::ui::status("none", "already in the base") }}
  {% else if parked %}
    {{ crate::web::ui::status("warning", format!("kept · {}% like a source", self.near_dupe_percent).as_str()) }}
  {% else %}
    {{ crate::web::ui::status("success", "kept") }}
  {% endif %}
  <a href="/ui/corpora/{{ id }}">View source</a>
</div>
