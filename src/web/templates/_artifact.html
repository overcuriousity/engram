<article class="artifact-row" id="artifact-{{ c.id }}">
  <div class="artifact-head">
    {# A passage has no title: its first line is its body. See `artifact_view`. #}
    {% if !c.title.is_empty() %}<span class="artifact-title">{{ c.title }}</span>{% endif %}
    <span class="spacer"></span>
    {{ crate::web::ui::status(c.embed_badge, c.embed_state) }}
  </div>
  <div class="md">{{ c.html|safe }}</div>
  <div class="oc-row">
    <button class="oc-btn" type="button" data-show="#edit-{{ c.id }}">{{ crate::web::icons::icon("pencil", 16) }}<span>Edit</span></button>
    <button class="oc-btn" type="button" hx-post="/ui/artifacts/{{ c.id }}/delete"
            hx-target="#artifact-{{ c.id }}" hx-swap="outerHTML">{{ crate::web::icons::icon("trash-2", 16) }}<span>Delete</span></button>
  </div>
  <form id="edit-{{ c.id }}" class="oc-form edit-form" hidden
        hx-put="/ui/artifacts/{{ c.id }}" hx-target="#artifact-{{ c.id }}" hx-swap="outerHTML">
    <div class="oc-field"><label for="edit-text-{{ c.id }}">Text</label>
      <textarea class="oc-input textarea-mid" id="edit-text-{{ c.id }}" name="text">{{ c.text }}</textarea></div>
    <div class="oc-form__actions oc-row">
      <button class="oc-btn oc-btn--primary" type="submit">Save and re-embed</button>
      <button class="oc-btn" type="button" data-hide="#edit-{{ c.id }}">Cancel</button>
    </div>
  </form>
</article>
