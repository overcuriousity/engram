# engram configuration.
#
# Every key can be overridden by an environment variable using the ENGRAM__
# prefix and __ as the nesting separator, e.g.
#   ENGRAM__INFER__EMBED__DIM=768
#
# Secrets (client_secret, api_key) belong in the environment, NOT in this file.
# The loader warns at startup if it finds one here.

[server]
bind = "127.0.0.1:8080"
# Background worker tasks draining the job queue. One is right when every role
# points at a single local GPU: a second worker does not double throughput,
# because the inference server serialises the calls anyway — it only makes two
# things slow at once. Raise it when synthesis and embedding live on
# different machines.
workers = 1

[store]
# SQLite file. Created on first run. Back this up.
path = "engram.db"

[vector]
# Qdrant base URL. Its REST API, not the gRPC port: 6333 locally, or whatever
# a reverse proxy serves it on (commonly plain https:// with no port).
url = "http://localhost:6333"
# Alias name. The vectors live in {name}_v1, {name}_v2, … behind it. An
# instance created before the corpus/segment/artifact rename will still say
# "chunks" here, and should keep saying it: the name is an address, not a
# description, and changing it points engram at an empty collection.
collection = "artifacts"
# api_key = "..."   # prefer ENGRAM__VECTOR__API_KEY

# How much age counts against a result. Fused ranks land between roughly 0.1
# and 1.0, so this breaks near-ties in favour of the newer note without
# overturning a clearly better match. Set to 0.0 to turn recency off.
recency_weight = 0.05
recency_half_life_days = 180
# Extra score for an artifact tagged `pinned`, so a decision you made beats the
# decay curve.
pinned_boost = 0.15

# ── Inference roles ─────────────────────────────────────────────────────────
# Three independent roles. They may all point at one server, or at three
# different ones — swapping any single role does not affect the others.

# Defaults here assume the case engram is built for: a small model on one
# consumer GPU, answering in minutes rather than seconds. Against a hosted API
# you can raise output_ratio's window and lower timeout_secs considerably.
[infer.synthesize]
base_url = "http://localhost:8000/v1"
model = "qwen"
# The model's real context window.
context_tokens = 32768
# Hard cap on output tokens per synthesis call. Generous on purpose: a
# reasoning model spends part of this thinking before it writes any JSON, and
# whatever it spends there is taken from the artifact list.
max_output_tokens = 16384
# Synthesis rewrites rather than splits, so its output can exceed its input.
# This is how much larger to assume it gets, and it is what sizes the segment:
# segment = min(context / (1 + ratio), max_output / ratio). At 8.0 that is
# ~2000 tokens of input per call. A 9B model that produces JSON which stops
# parsing partway through wants a higher number, not a lower one: a shorter
# segment is a shorter reply. Lower it (1.5-2.0) for a large hosted model.
output_ratio = 8.0
# Seconds before the client gives up on one call. Defaults to 900. A timeout
# looks exactly like a dead endpoint to the job runner: the job retries and
# fails at the same wall, so this must exceed the model's real worst case.
# timeout_secs = 900
# Sent as `reasoning_effort` when set. On a reasoning model the thinking comes
# out of max_output_tokens, so suppressing it is what stops the artifact list
# from being cut off. Unset by default: models that do not reason reject the field.
# reasoning_effort = "none"
# Seconds to idle between segments. Synthesising a long corpus is
# otherwise minutes of unbroken generation, which is a sustained thermal load
# on a desktop card rather than a burst. It does not save energy — the same
# tokens are generated either way — so it is off by default and exists for the
# machine sitting next to you.
# cooldown_secs = 15
# Optional path to a tokenizer.json for exact token counting. Without it,
# budgets fall back to a conservative characters/3.5 estimate.
# tokenizer_path = "/models/qwen/tokenizer.json"

[infer.embed]
base_url = "http://localhost:8000/v1"
model = "bge-m3"
# Embedding is fast even locally; a shorter ceiling surfaces a wedged endpoint
# instead of holding a worker for a quarter of an hour.
timeout_secs = 120
# MUST match the vector dimension of the Qdrant collection. Changing this
# against an existing collection is refused at startup.
dim = 1024
# The server's real ceiling, not the model's nominal one. llama.cpp refuses any
# input above its physical batch size (often 1024) with a 500, and no retry can
# fix that — engram splits the artifact instead, but it splits sooner and cheaper
# if this number is honest. Many embedding models cap at 512; check yours.
max_input_tokens = 1024

[infer.ask]
base_url = "http://localhost:8000/v1"
model = "qwen"
context_tokens = 32768
# ask is the one interactive inference call, so someone is watching it happen.
# timeout_secs = 900
# reasoning_effort = "none"

# Reranking is optional and disabled by default. There is no OpenAI-standard
# rerank endpoint, so the wire format is configured explicitly.
# style = "tei" | "cohere" | "vllm"
# [infer.rerank]
# base_url = "http://localhost:8001"
# model = "bge-reranker-v2-m3"
# style = "tei"

# ── Authentication ──────────────────────────────────────────────────────────
# Exactly one mode is active.

[auth]
mode = "local"

# Development only. Refuses to bind to a non-loopback address unless
# --i-know-this-is-insecure is passed. Generate the hash with:
#   cargo run -- --hash-password 'your password'
[auth.local]
username = "dev"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$REPLACE_ME$REPLACE_ME"

# Production. The allowlist is mandatory: leaving both lists empty denies
# everyone rather than admitting every account your identity provider knows.
# [auth.oidc]
# issuer_url = "https://idp.example/realms/main"
# client_id = "engram"
# client_secret = "..."          # prefer ENGRAM__AUTH__OIDC__CLIENT_SECRET
# redirect_url = "https://engram.example/auth/callback"
# scopes = ["openid", "profile", "email"]
# allowed_subs = ["sub-abc123"]
# allowed_emails = ["you@example.com"]

# Duplicate hygiene. Nothing here ever rewrites an artifact or deletes one on a
# similarity score: it hides, flags, or asks.
[consolidate]
# The background sweep. Capture-time near-duplicate detection is separate and
# always on: it costs a hash of the text, not a query.
enabled = true
# Estimated overlap of word shingles above which a new capture is parked as a
# near-duplicate of an existing corpus rather than segmented. It is stored
# either way; parking only withholds the model call until you decide on Ops.
near_dupe_min = 0.90
# Cosine at or above which a pair of artifacts goes on the review queue.
review_min = 0.88
# Cosine at or above which the older artifact is hidden without asking. Well
# clear of `review_min` on purpose: two genuinely distinct artifacts about one
# subsystem sit around 0.88 routinely, and hiding at that score costs knowledge
# rather than duplication. Ops lists what was hidden, with an undo.
auto_supersede = 0.95
# Points drawn per sweep, and neighbours considered per point. The sweep is one
# round trip whose cost these two numbers bound, rather than a query per point.
sample = 2000
per_point = 5
interval_hours = 24
# Ask the completion model whether a queued pair actually disagrees. Off by
# default: it is the only part of consolidation that costs inference, and it
# only ever sees pairs whose numbers, versions or dates already differ.
judge = false
max_judgements = 20
