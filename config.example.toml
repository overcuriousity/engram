# engram configuration.
#
# Every key can be overridden by an environment variable using the ENGRAM__
# prefix and __ as the nesting separator, e.g.
#   ENGRAM__INFER__EMBED__DIM=768
#
# Secrets (client_secret, api_key) belong in the environment, NOT in this file.
# The loader warns at startup if it finds one here.

[server]
bind = "127.0.0.1:8080"
# Background worker tasks draining the job queue. One is right when every role
# points at a single local GPU: a second worker does not double throughput,
# because the inference server serialises the calls anyway — it only makes two
# things slow at once. Raise it when synthesis and embedding live on
# different machines.
workers = 1

[store]
# The single-user database. Read by adoption alone (see [migrate] below), and
# meaningless once anyone is registered. A fresh install never touches it.
path = "engram.db"

# The control database: who the users are, their sessions and API tokens, and
# the one instance-wide job queue. Everything about people and scheduling
# rather than about knowledge. Created on first run.
# control_path = "engram-control.db"

# Where the per-user databases live, one {slug}.db each. The slug is a hash of
# the OIDC subject, derived once at provisioning and stored, so it survives any
# later change to how it is derived.
#
# A backup is this directory *and* control_path, taken together. Restoring one
# side from a different moment shows up as store drift, which heal_store_drift
# repairs per tenant on that tenant's next open.
# dir = "data/users"

# How many users' bases may be open at once. An open tenant costs a SQLite pool
# and a background queue; the rest are opened on demand, and eviction is
# transparent — the next request or claim reopens the same file, and the
# evicted user's live sitting is handed back to it, so what search and ask
# carry does not depend on how many other people are reading right now.
# max_open_tenants = 32

# ── Adoption ─────────────────────────────────────────────────────────────────
# Hand an existing single-user installation to its first real user, once.
#
# Set this to the OIDC subject of whoever has been using the base, start
# engram, and it moves store.path to store.dir/{slug}.db, writes the user row
# with the judge granted, and renames the existing Qdrant alias onto
# {vector.collection}_{slug}. The alias moves rather than the collections
# behind it, so nothing re-embeds and the generation history is preserved.
#
# It is guarded on the users table being empty, so it fires exactly once and
# cannot go off on a running instance however this file is edited afterwards.
# If the alias rename fails the file move is rolled back: a half-adopted
# install that boots reads as a base whose searches have gone empty, which is
# worse than one that refuses. Leave the key set or remove it; both are no-ops
# on the second boot.
# [migrate]
# adopt_subject = "sub-abc123"

[vector]
# Qdrant base URL. Its REST API, not the gRPC port: 6333 locally, or whatever
# a reverse proxy serves it on (commonly plain https:// with no port).
url = "http://localhost:6333"
# Alias name. The vectors live in {name}_v1, {name}_v2, … behind it. An
# instance created before the corpus/segment/artifact rename will still say
# "chunks" here, and should keep saying it: the name is an address, not a
# description, and changing it points engram at an empty collection.
collection = "artifacts"
# api_key = "..."   # prefer ENGRAM__VECTOR__API_KEY

# How much age counts against a result. Fused ranks land between roughly 0.1
# and 1.0, so this breaks near-ties in favour of the newer note without
# overturning a clearly better match. Set to 0.0 to turn recency off.
recency_weight = 0.05
recency_half_life_days = 180
# Extra score for an artifact tagged `pinned`, so a decision you made beats the
# decay curve.
pinned_boost = 0.15
# Chunks one document may contribute to a result list, so a long document
# cannot fill it. 0 lets one document supply every result. This and
# recency_weight above are the two knobs the tuning sweep measures, and
# applying its recommendation rewrites them here — see [feedback.tune].
per_source_cap = 3

# ── Inference roles ─────────────────────────────────────────────────────────
# Three independent roles. They may all point at one server, or at three
# different ones — swapping any single role does not affect the others.
#
# An endpoint is named once, under [infer.tiers.<name>], and the roles point at
# it. That is what lets "which model is this call worth" be answered per call
# rather than per role: two roles on one tier share a model by saying so, and a
# role moves to another model by changing one word.
#
# `tier` is required on [infer.synthesize] and [infer.ask]: an endpoint is
# defined once, under [infer.tiers.<name>], and the roles point at it.

# Defaults here assume the case engram is built for: a small model on one
# consumer GPU, answering in minutes rather than seconds. Against a hosted API
# you can raise output_ratio's window and lower timeout_secs considerably.

[infer]
# How much inference capture spends.
#   "off"    — split the text into verbatim passages, embed them, call nothing.
#              [infer.synthesize] and [infer.ask] may be left out entirely.
#   "earned" — the same capture; synthesis runs later where use has shown it
#              is worth it. Needs [infer.synthesize]. The default.
#   "eager"  — one synthesis call per segment at capture.
#
# "earned" is the default because capture cannot know which paragraph will be
# asked about. Your text goes in as you wrote it; a window is rewritten once
# reading has shown the rewrite is worth making, and every synthesized artifact
# in the base can name the use that earned it. Choose "eager" when you want
# everything pre-written and are willing to pay a model call per segment for
# text most of which is never retrieved.
synthesis = "earned"
# Window size when there is no [infer.synthesize] to derive one from, in
# engram's estimator tokens. Ignored when a synthesizer is configured.
# segment_tokens = 4096

# The working tier: everything that runs unattended, in bulk, and is paid for
# by the corpus rather than by a person waiting.
[infer.tiers.efficient]
base_url = "http://localhost:8000/v1"
model = "qwen"
# The model's real context window.
context_tokens = 32768
# Hard cap on output tokens per call. Generous on purpose: a reasoning model
# spends part of this thinking before it writes any JSON, and whatever it
# spends there is taken from the artifact list.
max_output_tokens = 16384
# Seconds before the client gives up on one call. Defaults to 900. A timeout
# looks exactly like a dead endpoint to the job runner: the job retries and
# fails at the same wall, so this must exceed the model's real worst case.
# timeout_secs = 900
# Sent as `reasoning_effort` when set. On a reasoning model the thinking comes
# out of max_output_tokens, so suppressing it is what stops the artifact list
# from being cut off. Unset by default: models that do not reason reject the field.
# reasoning_effort = "none"

# Which name this endpoint takes the output ceiling under: "max_tokens" or
# "max_completion_tokens". The two mean the same thing and no endpoint takes
# both — OpenAI's reasoning models refuse `max_tokens` with a 400 naming the
# other, and llama.cpp/vLLM read `max_tokens` and silently ignore what they do
# not recognise.
#
# Unset by default, which means: guess from `reasoning_effort`, then correct the
# guess the first time the endpoint refuses the name. Any effort but "none"
# implies the hosted spelling; "none" is what a local endpoint is told to
# suppress its thinking and says nothing either way, so it is read as
# `max_tokens` — the guess that a hosted endpoint corrects with a 400, rather
# than the one a local endpoint drops in silence.
#
# Set it explicitly wherever the guess would be wrong with no 400 to correct it,
# which is any endpoint that ignores an unrecognised ceiling rather than
# refusing it. Startup logs a warning naming the guess whenever this is unset
# and `reasoning_effort` is not.
#
# The name belongs to the server, not to the role — which is why it lives on
# the tier. It is still keyed by (base_url, model) rather than by tier name, so
# two tiers pointed at the same server and model — which is exactly what
# `efficient` and `deep` are below, by default — share one learned name. Where
# two of them are told different things, startup warns and the first one wins;
# what an operator states beats what another role inferred.
# ceiling_param = "max_tokens"

# Send the reply's JSON Schema as an OpenAI `json_schema` response format, so
# the endpoint constrains decoding to the shape the parser expects. On by
# default. A 9B model asked for JSON will otherwise close an array with a brace
# or omit a required field often enough that windows fail permanently, and the
# parse error it produces is indistinguishable from a truncated reply. Honoured
# by llama.cpp, vLLM and the hosted APIs; set false for an endpoint that rejects
# the field. Governs both judges too — duplicates and associative links — which
# run on this endpoint under a schema each.
# structured_output = true

# The tier for calls a person is waiting on. The same server as `efficient`
# here, because the case engram is built for has exactly one; point it at a
# larger model wherever there is one, and only the answering changes.
[infer.tiers.deep]
base_url = "http://localhost:8000/v1"
model = "qwen"
context_tokens = 32768
# Hard cap on output tokens per answer, sent on every call. Raise it if answers
# are getting clipped; there is no reason to unset it, since an endpoint asked
# for no ceiling applies its own — which is far larger, and is the only thing
# bounding a reply the model has stopped being able to end.
#
# It comes out of `context_tokens`: the endpoint measures the prompt and this
# ceiling against one window, so ask reserves this much and packs excerpts into
# what is left. Raising it buys longer answers by showing the model fewer
# excerpts, and `dropped` on the answer says how many.
#
# Never more than half the window, though, whatever it is set to: a ceiling as
# wide as its own context would reserve everything, pack nothing, and answer
# every question with "too large for the configured context window". The call
# itself then asks for whatever the packed prompt actually left over, up to this
# number — and if the answer still runs into it, the answer says so.
max_output_tokens = 4096
# See [infer.tiers.efficient] for timeout_secs, reasoning_effort,
# ceiling_param and structured_output. Each is a property of this server, so
# each is set here again rather than inherited from the other tier.
# timeout_secs = 900
# reasoning_effort = "none"
# ceiling_param = "max_tokens"

[infer.synthesize]
tier = "efficient"
# Synthesis rewrites rather than splits, so its output can exceed its input.
# This is how much larger to assume it gets, and it is what sizes the segment:
# segment = min(context / (1 + ratio), max_output / ratio). At 8.0 that is
# ~2000 tokens of input per call. A 9B model that produces JSON which stops
# parsing partway through wants a higher number, not a lower one: a shorter
# segment is a shorter reply. Lower it (1.5-2.0) for a large hosted model.
output_ratio = 8.0
# Any tier field can be overridden here for this role alone, e.g. a shorter
# ceiling than the tier's:
# max_output_tokens = 8192
# Pacing lives in `[pacing]` at the bottom of this file.
# Tokens of the document's verbatim opening prepended to every window, so an
# artifact from deep in a long document still knows what product, version and
# platform it belongs to — which is what the caveats field asks for and what a
# window eight hundred lines in has no other way to learn.
# context_opening_tokens = 200
# Tokens of each neighbouring window carried on both sides, so a window that
# opens mid-procedure can still resolve what "this command" points at. Both of
# these come out of the window itself: at 200 and 150 that is 540 tokens of
# prompt, so a smaller window and proportionally more calls per corpus. Set
# either to 0 to turn that half off.
# context_overlap_tokens = 150

[infer.embed]
base_url = "http://localhost:8000/v1"
# EmbeddingGemma. 308M parameters, 768 dimensions, a 2048-token window, and an
# asymmetric interface: queries and documents are embedded through different
# prompts, which the three templates below are. The model card's exact strings
# are the defaults, so nothing below `max_input_tokens` needs setting for it.
model = "embeddinggemma"
# Embedding is fast even locally; a shorter ceiling surfaces a wedged endpoint
# instead of holding a worker for a quarter of an hour.
timeout_secs = 120
# MUST match the vector dimension of the Qdrant collection. Changing this
# against an existing collection is refused at startup. The full Matryoshka
# width: truncating to 512/256/128 buys memory at a recall cost, and recall is
# the point.
dim = 768
# The server's real ceiling, not the model's nominal one. llama.cpp refuses any
# input above its physical batch size with a 500, and no retry can fix that —
# engram splits the artifact instead, but it splits sooner and cheaper if this
# number is honest. 2048 is the model's window; use the server's if lower.
max_input_tokens = 2048
# Passage size at synthesis = "off"/"earned", in estimator tokens: about a
# paragraph and a half, which is about one idea. Clamped to what the embedder
# will take (max_input_tokens * 0.8). Argued, not measured — the judge
# harness is what is allowed to move it.
# chunk_tokens = 384
# The recipe. `{text}` is the query or the body; `{title}` is the artifact's
# title. A document with no title takes the `_untitled` template — the model
# card substitutes the literal word `none`, so it is a second template and not
# an empty field. Changing any of these invalidates every stored vector as
# surely as changing `model` does: drop the collection and re-capture. engram
# records the recipe — model, dim and the three templates — and says so at boot
# when it no longer matches what the stored vectors were embedded under. Check
# once that your serving stack does not prepend a prompt of its own, or the
# prefix is sent twice and every vector carries it.
# query_template             = "task: search result | query: {text}"
# document_template          = "title: {title} | text: {text}"
# document_template_untitled = "title: none | text: {text}"
#
# A symmetric embedder — bge-m3, which engram shipped with — wants the text as
# it is. That is these three lines, with `dim = 1024` and the server's ceiling:
# model = "bge-m3"
# dim = 1024
# max_input_tokens = 1024
# query_template             = "{text}"
# document_template          = "{title}\n{text}"
# document_template_untitled = "{text}"

[infer.ask]
tier = "deep"
# ask is the one interactive inference call, so someone is watching it happen.
# Overriding any tier field for this role alone works here too:
# max_output_tokens = 4096
# timeout_secs = 900
# reasoning_effort = "none"

# One bounded round of planned retrieval. After the excerpts for the question
# are packed, the model says once which subjects they do not cover; each becomes
# a search of its own, all of them run at once, and the results are merged into
# one set of excerpts before it answers. At most three extra searches — never a
# second plan, and never a loop.
#
# On by default: a question that spans several subjects is retrieved for all of
# them or answered from whichever one the single ranked list happened to favour.
# It costs one model call per question, so put that call on a cheap tier below
# rather than turning this off. Off is for a base with one slow endpoint and
# nothing cheaper to point at.
# plan = false
#
# Which endpoint that call runs on. Naming the subjects a set of excerpts misses
# is a cheap classification, not the answer, so it belongs on the efficient
# model even when the answer it feeds belongs on the deep one — which is what
# naming tiers per role is for. Unset, it runs on this role's own endpoint,
# which means paying deep-model latency for a short list.
# plan_tier = "efficient"

# Reranking is optional and disabled by default. There is no OpenAI-standard
# rerank endpoint, so the wire format is configured explicitly.
# style = "tei" | "cohere" | "vllm"
# [infer.rerank]
# base_url = "http://localhost:8001"
# model = "bge-reranker-v2-m3"
# style = "tei"
#
# Where the reranker is consulted. Both places unless narrowed. Typing in the
# web UI never waits on it either way: keystrokes come back in vector order at
# embedding speed, and the reranked order lands as a visible refinement once
# the query settles. `apply = ["ask"]` is the opt-out for search entirely —
# for a rerank endpoint slow or billed enough that only a deliberate question
# should spend it.
# apply = ["ask", "search"]

# Reading captured images. Optional and disabled by default: with this block
# absent the image door is closed and the capture page offers text only.
#
# `model` is required and stays here whatever else moves: it names the vision
# model, which is the point of the block, and it is never taken from a tier.
# With no `tier` and no `base_url`, the role calls the synthesize endpoint —
# the common case, one local server hosting a multimodal model too, and not a
# shape that gets warned about. Give it a `tier` or a `base_url` when a
# separate endpoint serves the images.
# [infer.vision]
# model = "qwen2.5-vl-7b"
# tier = "efficient"
# base_url = "http://localhost:8002/v1"
# api_key = ""
# Seconds before one description is given up on. Defaults to 120 — about one
# image, and short on purpose, since a person is usually waiting on a capture.
# A role pointed at a tier takes the tier's timeout instead, because a timeout
# describes the server; set it here to keep the shorter bound anyway.
# timeout_secs = 120
# Hard cap on output tokens per description, sent on every call. Defaults to
# 4096 and is never taken from a tier, however this block gets its endpoint: a
# tier's ceiling is sized for the role it was written for, and what comes back
# here is stored as a corpus and segmented from there, so an endpoint left to
# apply its own ceiling is a document nobody sized.
# max_output_tokens = 4096
# See [infer.tiers.efficient].ceiling_param. Taken from the tier when this
# block names one, and from the synthesize role when it has no endpoint of its
# own — in both cases because it is then the same server.
# ceiling_param = "max_tokens"

# ── Authentication ──────────────────────────────────────────────────────────
# Exactly one mode is active.

[auth]
mode = "local"

# Development only. Refuses to bind to a non-loopback address unless
# --i-know-this-is-insecure is passed. Generate the hash with:
#   cargo run -- --hash-password 'your password'
[auth.local]
username = "dev"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$REPLACE_ME$REPLACE_ME"

# Production. The allowlist is mandatory: leaving all three lists empty denies
# everyone rather than admitting every account your identity provider knows.
# [auth.oidc]
# issuer_url = "https://idp.example/realms/main"
# client_id = "engram"
# client_secret = "..."          # prefer ENGRAM__AUTH__OIDC__CLIENT_SECRET
# redirect_url = "https://engram.example/auth/callback"
# scopes = ["openid", "profile", "email"]
# allowed_subs = ["sub-abc123"]
# allowed_emails = ["you@example.com"]
# Membership in any of these groups also admits a subject. Requires the
# provider to actually send a `groups` claim — on Nextcloud's OIDC provider
# app that means turning on group provisioning for this client; a request
# `scope` entry alone does not produce it.
# allowed_groups = ["engram-users"]

# Duplicate hygiene. Nothing here ever rewrites an artifact or deletes one on a
# similarity score: it hides, flags, or asks.
[consolidate]
# The background sweep. Capture-time near-duplicate detection is separate and
# always on: it costs a hash of the text, not a query.
enabled = true
# Estimated overlap of word shingles above which a new capture is parked as a
# near-duplicate of an existing corpus rather than segmented. It is stored
# either way; parking only withholds the model call until you decide on Ops.
near_dupe_min = 0.90
# Cosine at or above which a pair of artifacts goes on the review queue.
review_min = 0.88
# Cosine at or above which the older artifact is hidden without asking. Well
# clear of `review_min` on purpose: two genuinely distinct artifacts about one
# subsystem sit around 0.88 routinely, and hiding at that score costs knowledge
# rather than duplication. Ops lists what was hidden, with an undo.
auto_supersede = 0.95
# Neighbours considered per artifact when it looks for duplicates.
per_point = 5
interval_hours = 24
# The dedupe pass acts on what it decides: superseding where one stored
# artifact plainly replaces another, and writing one merged artifact where each
# side carries something the other lacks. A disagreement about a value is never
# settled this way. It goes to the review queue on Capture, because deciding
# which of two facts is current is the judgement a model is worst at. Nothing
# is deleted, no merge that would drop a number, command or path is written,
# and every merge has an undo on Ops.
# How often the dedupe pass arms model calls, and how many per tick. Together
# these are a rate — twenty an hour by default — and a rate is the right shape
# because the fixed quantity is what the hardware gets through, not how big the
# knowledge base has grown. The old per-sweep ceiling was a queue that only grew.
#
# Set max_dedupe_per_tick = 0 to switch the model off entirely. Duplicates are
# still found, recorded and clustered, all of which costs no inference; nothing
# is ever asked about.
dedupe_interval_mins = 15
max_dedupe_per_tick = 5
# ── Learning from what happens here ─────────────────────────────────────────
# One switch over the whole layer: recording searches, learning links from
# co-retrieval, activation, pursuits, and the area under the search box. These
# were three separate flags — [feedback], [associate] and [pursuit] each had
# their own — and two of their combinations were refused at startup while a
# third was a warning, which is how you find out they were one setting written
# three times. The sections below keep their thresholds; this is the switch.
#
# The three old keys are refused at startup rather than ignored. Deserialization
# drops what it does not recognise, and `[feedback] enabled = false` is a key
# whose whole purpose was to say "keep none of this" — ignored, it would have
# said nothing, and an upgrade would have turned recording back on for the
# operator who had most explicitly refused it.
#
# On by default. Everything downstream of it moves only while the log is being
# written, so off is the deliberate act. Nothing here leaves the machine, Ops
# forgets all of it on one press, and off means nothing is recorded in the
# first place.
[learn]
enabled = true

# Recording real searches so they can be judged later, and turned into the
# query/artifact pairs the evaluation harness scores against.
#
# The queries a benchmark needs cannot be written from memory. Phrased while
# looking at an artifact, they reuse its wording, and every retrieval system
# passes such a pair. Only a search made in earnest — before anything came back
# — is worth scoring against, and this is the only moment it can be recorded.
#
# Everything is recorded, not only deliberate searches: the search where you
# found nothing and gave up leaves no other trace, and it is the most valuable
# one there is. Typing bursts fold into their final wording, so `daten`,
# `datentr`, `datenträger nicht erkannt` is one event rather than three.
[feedback]
# No switch here: see [learn], which is the one switch over all of this.
# Candidates stored per search. Wider than the answer on purpose — retrieval
# over-fetches anyway, so the extra rows cost nothing, and they are what lets an
# artifact the ranking buried still be confirmed as the right one. 0 is not a
# setting — an empty pool leaves every card with nothing to choose — and is put
# back to the default with a line in the log.
candidates = 20
# Window in which a longer query — or the same one again — replaces the previous
# event instead of starting its own. 0 turns folding off. Applies to the search
# box only, and only
# within one signed-in operator: a call through the API or MCP is a deliberate
# query, not a keystroke, and two people typing at once are not typing the same
# thing.
coalesce_secs = 15
# Days an unjudged captured search is kept. 0 keeps them forever. A judged hit
# or gap is exempt: it is the labelled pair the whole feature exists to produce,
# and expiring it would empty `--export-eval` a month at a time. A `discard` is
# not exempt — that verdict says the search was never real. The purge button on
# Ops still takes everything.
retain_days = 0
# How often retention is enforced. A window measured in days does not need
# checking more often than this, and the sweep is a single DELETE.
sweep_hours = 6

# What judged searches are spent on: a background sweep of recency_weight and
# per_source_cap over every judged pair, which recommends a better setting when
# it finds one worth the name. See docs/evaluation.md.
[feedback.tune]
# Judgements before the first sweep. A floor, not a target: with ten pairs
# recall@10 moves in ten-point steps, and a sweep under that recommends the
# quirks of ten queries as confidently as a real improvement.
min_judgements = 50
# Further verdicts before the sweep is run again.
resweep_after = 10

# Links learned from co-retrieval, and a decaying accessibility per artifact.
# Both are learned from use and neither touches what is stored: the trace is
# fixed, access is plastic. Runs behind [learn] — without recorded searches
# there is nothing to learn from.
[associate]
# How often the sweep replays the search log. Pure SQLite, no model call.
interval_mins = 30
# A link unused for this long has half the strength it had. One co-appearance is
# +1 and one confirmed answer is +2, so these numbers are in "uses".
half_life_days = 30
# Below this, a link nobody has ruled on is forgotten. A judged one never is: a
# verified relation is about content, not use.
prune_below = 0.5
# Strength at which a link is worth showing, and at which it is worth one call.
show_min = 2.0
judge_min = 4.0
# Distinct questions a link needs before it is judged. One question asked six
# times is one question, and this is what keeps the judge cheap.
judge_min_queries = 3
judge_per_sweep = 10
# How many top hits are asked what they are linked to, and how many associated
# hits may be appended after the ranked list — outside `limit`, never instead
# of a ranked hit.
spread_from = 3
spread_max = 3
# How much more accessible a hit must be than the one above it to pass it, as a
# fraction of the most accessible hit in that list; and how many places it may
# climb. 0 turns priming off. Neither default moves until the eval harness has
# been run with it off and on against the frozen corpus.
prime_margin = 0.5
prime_lift = 2

[activation]
half_life_days = 14
# Returned by a deliberate search, opened in the pane, judged the answer. Being
# surfaced *because* of activation — resurfaced, or recalled by a link — raises
# nothing: that is the loop this design exists to close.
retrieved = 1.0
opened = 0.5
confirmed = 3.0
# Cited by an answer /ask wrote. A model's use of an artifact, not a person's,
# which is why it weighs what an open weighs and not what a confirmation does:
# nothing here verified that the answer was right. Only the web door records
# which artifacts an answer used, so only the web door raises this.
cited = 0.5

# ── Promotion ────────────────────────────────────────────────────────────────
# At synthesis = "earned", when a passage has earned its window a synthesis
# call. Read against [activation]: baseline 1.0 at capture, so 4.0 is one
# confirmation after a retrieval and an open, or about three engaged openings.
# Checked only when a passage is opened, confirmed or cited by an answer —
# never when it merely appears in results — and the window's new artifacts inherit the access the
# passages earned.
[promote]
activation_above = 4.0
# At synthesis = "eager": an artifact shown this many times with no
# confirmation recorded against it is re-read from its source segment. 0
# disables it, and it ships disabled — re-synthesising changes what an
# existing base contains without anyone asking.
resynthesize_after_unconfirmed = 0

# ── Pursuits ─────────────────────────────────────────────────────────────────
# A coherent run of searches, what was opened and pivoted through, and — when
# the base did not answer or the answer was assembled by hand — one generated
# artifact written from exactly that, carrying the questions it was written
# for. Runs behind [learn]: the events it reads are the ones recording writes,
# and the sweep it rides on is the associative pass. Local only, nothing leaves
# the machine, and the forget button on Settings clears all of it. The grouping
# line is measured, not configured.
[pursuit]
# A pursuit is over when nothing has happened for this long.
idle_secs = 900
# Fewer engaged artifacts than this is a promotion case, not generation.
min_sources = 2
# Engagement weight a pursuit needs before it is worth a call: opened 1.0,
# pivoted 1.5, returned 2.0, confirmed 3.0.
min_engagement = 3.0

# ── A recommendation under the search box ────────────────────────────────────
# The area under the search box, filled from the situation the page was opened
# in: the time zone and local time the browser reports, the device, the
# viewport, the network, the battery. A sweep learns which situations recur for
# which artifact; a page view is one vector query against what it learned. No
# model call and no embedding on this path, ever.
#
# On, and behind [learn] as well: the situations it clusters are opens recorded
# in the same log everything else here reads. Forgetting on Settings takes them
# in both places they live — the rows and the centroids on the points — and the
# 400-day window over them keeps ageing whether or not [learn] is on, because
# switching a thing off is when its data most needs to leave. A weekly pattern needs weeks, so a
# young base sees the bottom rung — a card drawn at random, claiming nothing —
# until it has something to say.
[recommend]
enabled = true
# Cosine above which an event joins a cluster rather than opening its own.
cluster_merge_at = 0.82
# Situations kept per artifact, per person. More than one is the point: a thing
# looked up on Friday afternoons and occasionally on Monday mornings is two
# situations, and their mean is a situation that never happened.
max_clusters = 5
# A pattern that stops fades rather than standing for ever.
half_life_days = 45.0
# A cluster lighter than this is dropped. Low enough that a single recent event
# survives: a thing done twice is worth saying so about, it is just not worth
# calling a pattern.
min_weight = 0.9
# Weight at or above which a situation is spoken of as established. Below it the
# offer says how many times it has happened instead — "Twice before" — and
# demands a strong match before saying anything at all, because there is less
# behind it. At the default half-life this is the third repetition.
firm_at = 2.5
# Score at or above which an established situation is called a pattern, and
# above which it is called a resemblance. Below both, a card is drawn at random
# with no reason printed beside it — something to look at while the base has
# nothing to say about the situation. Scored without the `scope` block, which
# decides *who* may be offered something rather than how well it matches.
strong_at = 0.75
weak_at = 0.45
# What an open of something this offered counts for, back into the profile.
# Zero: without it, the first lucky guess grows into a habit the system taught
# itself.
self_weight = 0.0

# What each named block of the situation is worth. Each block is normalised to
# length 1 and then scaled by its weight, so a block contributes exactly its
# weight however many dimensions it uses — seven one-hot slots for the weekday
# do not outweigh two for the hour because there are seven of them.
[recommend.weights]
# Interim, and load-bearing: every person shares one collection today, so this
# is what keeps one person's situations from being offered to another. It goes
# to 0 when each user has their own collection.
scope = 10.0
# The hour, as an angle — 23:30 and 00:30 are an hour apart, and 14:55 against a
# 15:00 pattern costs almost nothing.
time_of_day = 1.0
# One-hot, because "Friday is three from Tuesday" means nothing and the pattern
# is exactly Friday.
weekday = 1.0
# The part of the weekday that genuinely is gradual, kept separate and weak.
weekend = 0.3
device = 0.8
viewport = 0.4
locale = 0.3
network = 0.6
power = 0.2
environment = 0.2
# Off. A monthly rhythm is real, but nothing has shown one here yet.
month_cycle = 0.0

# ── Scheduling ───────────────────────────────────────────────────────────────
# The queue is the scheduler. Whether somebody is waiting on a unit is a
# constant per stage rather than a setting: a priority you can set wrong
# presents as "the capture is hanging", with nothing anywhere saying why. What
# is left to decide is the one number that keeps priority from becoming
# starvation.
[schedule]
# A background unit waiting longer than this becomes foreground. Without it,
# one long ingest keeps night work off the workers for as long as it lasts.
# The default is a guess; the sweep history on Ops is how you check it — a
# sweep whose runs thin out says the guess is wrong.
#
# `0` does not switch ageing off, it makes every waiting unit old enough at
# once: the two classes stop dividing anything and the queue behaves as it did
# before priority existed. There is no way to switch ageing off, because a base
# under constant capture with no ageing never runs its night work at all.
#
# At most twenty units are promoted per repair pass, so a backlog that built up
# behind a slow endpoint cannot put itself in front of a capture all at once.
age_after_mins = 60

# The ceiling on how long a sweep that keeps finding nothing waits before
# looking again. Each consecutive empty run doubles the wait up to this.
#
# A base with nothing to do wakes, queries, finds nothing and sleeps — once per
# interval per sweep, for ever, and once per user besides. That costs no model
# calls (a sweep with nothing to do makes none), so the answer is proportionate:
# a wake-up, a file open and a handful of queries, spread out. Any new data
# cancels the wait outright, because every producer already pulls a sleeping
# unit forward, so a quiet base runs its sweeps late and never not at all.
# backoff_max_hours = 24

# ── The sitting ──────────────────────────────────────────────────────────────
# What this session has touched, carried between search, ask and capture. In
# memory only: it dies with the process, because a working memory that survives
# a restart is a long-term memory and engram has one of those already. The web
# door only — an access token is not a conversation.
#
# Carrying is always on and changes no order: a prefilled ask box, the question
# an answer answered, a rail of what you have been in.
[sitting]
# Let what this sitting has touched lift a result.
#
# The only part of the sitting that moves an order, and the same query ranking
# differently in two sittings is exactly what is disorienting about it — so it
# is off, the lift shares the one budget `associate.prime_lift` bounds, rank 0
# never moves, and a hit it lifted says so on the row.
prime = false

# ── Pacing ───────────────────────────────────────────────────────────────────
# One gap in front of every inference call, whatever its role. The roles share
# one GPU, so a per-role cooldown could not bound total load.
[pacing]
# Minimum seconds between the end of one background generation and the start of
# the next, and only one background call runs at a time however many workers are
# configured, so this is the gap between calls rather than per worker. Zero
# disables pacing. A question asked through `ask` ignores it: someone is
# waiting, and the pacer is there to protect the GPU from batch work.
#
# Embedding ignores it as well, for the opposite reason. It still takes its
# turn — a batch never runs alongside a generation, which is what actually
# bounds a shared GPU — but it serves no gap and starts none. The gap is sized
# against a generation; an encoder answering a batch of 32 in about a second is
# not one, and pacing it spends nearly the whole budget on the one role that
# needs no protecting. At `synthesis = "earned"`, where capture generates
# nothing at all, that was most of what this setting did.
cooldown_secs = 0

[capture]
# The upload, paste-a-link and extension doors.
#
# Seconds a server-side GET may take. This is a network fetch, not a model
# call, so it is not measured in minutes.
fetch_timeout_secs = 30
# Bytes read from a fetched URL before the transfer is abandoned. Separate
# from the 8 MB request-body limit: that one bounds what you send engram,
# this one bounds what engram goes and gets.
fetch_max_bytes = 8388608
# Characters an extraction must yield to count as a capture. A page that
# reduces to less than this was a login wall or a cookie banner, and is
# reported as a failure rather than stored. Fidelity outranks convenience:
# a corpus that quietly holds the subscribe prompt instead of the article is
# worse than no capture at all.
min_extracted_chars = 200
# Bytes an uploaded image may weigh. The image door has its own ceiling
# because a phone photo is several times the 8 MB the rest of the API allows.
image_max_bytes = 26214400

# Bytes an uploaded PDF may weigh. The upload door has its own ceiling for a
# PDF, well above the 8 MB request-body limit, because a book is tens of
# megabytes. Nothing else bounds one: there is no page cap, and a long document
# simply becomes a long queue.
pdf_max_bytes = 52428800
# Longest edge of the preview shown to the vision model and in the UI. The
# original is stored untouched either way.
image_preview_edge = 2048

[ui.background]
# The rotating point cloud behind the pages, sampled from the vector store.
# Purely decorative; off leaves the pages plain.
enabled = true
# Vectors sampled per snapshot. Capped at 20000 on read: the number reaches a
# Qdrant scroll limit and a projection loop at once, and this is a decoration.
sample_size = 2000
# Seconds the client keeps a snapshot before fetching another (6 h). Also the
# `max-age` on the response, so a browser that cannot write local storage still
# only asks this often. Zero means fetch on every page load.
refresh_secs = 21600
