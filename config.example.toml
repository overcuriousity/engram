# engram configuration. Override any key with ENGRAM__SECTION__KEY, e.g. ENGRAM__INFER__EMBED__DIM.
# Secrets belong in the environment or a file (ENGRAM__…__KEY_FILE), not here.

[learn]
# off: record and learn nothing · learning: record, read nothing back · full: all of it.
mode = "full"
# The recording switch; set by `mode` unless written here.
#enabled = true

[server]
bind = "127.0.0.1:8080"
# The https address users reach; required unless bind is loopback.
# public_url = "https://engram.example"
# Proxies whose X-Forwarded-For is trusted.
# trusted_proxies = ["127.0.0.1/32", "::1/128"]
# Permit an http public_url on a non-loopback host.
# allow_plain_http = false
# Job-queue workers; one is right when every role shares one GPU.
workers = 1
# base64 SHA-256 of the certificate's SPKI, carried in the pairing code; unset pins on first sight.
# tls_fingerprint = ""

[store]
# Users, API tokens, sessions and the job queue.
# control_path = "engram-control.db"
# One {slug}.db per user; back up together with control_path.
# dir = "data/users"
# Tenant bases open at once; the rest reopen on demand.
# max_open_tenants = 32

[vector]
# Qdrant REST URL (6333, not the gRPC port).
url = "http://localhost:6333"
# Alias over {name}_v1, {name}_v2, …; an address, so keep an existing one as it is.
collection = "artifacts"
# api_key = "..."   # prefer ENGRAM__VECTOR__API_KEY
# Age penalty against fused ranks (~0.1–1.0); 0 turns recency off.
recency_weight = 0.05
recency_half_life_days = 180
# Extra score for an artifact tagged `pinned`.
pinned_boost = 0.15
# Results one source may contribute; 0 is unlimited. The idle pass may move this.
per_source_cap = 3
# Over-fetch factor when the cap or the reranker narrows the list.
candidate_multiplier = 3

[infer]
# HF tokenizer.json (path or URL) for token budgets; unset uses the bundled Qwen tokenizer.
# tokenizer = "https://huggingface.co/Qwen/Qwen3-8B/resolve/main/tokenizer.json"

# Unattended bulk work.
[infer.tiers.efficient]
base_url = "http://localhost:8000/v1"
model = "qwen"
# The model's real context window.
context_tokens = 32768
# Output cap per call; a reasoning model spends part of it thinking.
max_output_tokens = 16384
# Must exceed the model's real worst case, or jobs retry into the same wall.
# timeout_secs = 900
# Sent as `reasoning_effort`; models that do not reason reject it.
# reasoning_effort = "none"
# "max_tokens" or "max_completion_tokens"; unset guesses and corrects on a 400.
# ceiling_param = "max_tokens"
# Constrain decoding to the reply's JSON Schema; false for endpoints that reject it.
# structured_output = true

# Calls a person waits on.
[infer.tiers.deep]
base_url = "http://localhost:8000/v1"
model = "qwen"
context_tokens = 32768
# Reserved out of context_tokens for the answer; capped at half the window.
max_output_tokens = 4096
# timeout_secs = 900
# reasoning_effort = "none"
# ceiling_param = "max_tokens"

# Optional; without it captures stay verbatim passages (embed-only floor).
[infer.synthesize]
tier = "efficient"
# Assumed output/input growth; sizes the segment. Higher for small models, 1.5–2 for large.
output_ratio = 8.0
# Any tier field may be overridden for this role alone.
# max_output_tokens = 8192
# Neighbouring artifacts shown to a small capture's synthesis; 0 turns it off.
# context_neighbor_tokens = 1024
# The document's opening prepended to every window.
# context_opening_tokens = 200
# Neighbouring window carried on both sides; 0 turns it off.
# context_overlap_tokens = 150

[infer.embed]
base_url = "http://localhost:8000/v1"
# EmbeddingGemma; the templates below default to its model card.
model = "embeddinggemma"
timeout_secs = 120
# Must match the Qdrant collection; a change is refused at startup.
dim = 768
# The server's real input ceiling, not the model's nominal one.
max_input_tokens = 2048
# Passage size; clamped to max_input_tokens × 0.8.
# chunk_tokens = 384
# Changing a template invalidates every stored vector.
# query_template             = "task: search result | query: {text}"
# document_template          = "title: {title} | text: {text}"
# document_template_untitled = "title: none | text: {text}"
# A symmetric embedder such as bge-m3:
# model = "bge-m3"
# dim = 1024
# max_input_tokens = 1024
# query_template             = "{text}"
# document_template          = "{title}\n{text}"
# document_template_untitled = "{text}"

[infer.ask]
tier = "deep"
# max_output_tokens = 4096
# timeout_secs = 900
# reasoning_effort = "none"
# One bounded round of extra searches for subjects the excerpts miss.
# plan = false
# Tier for that planning call.
# plan_tier = "efficient"

# The decision model: Decide and background judgement run on it. Required.
# Point it at a System One server (a small, fast, non-thinking model).
[infer.decide]
base_url = "http://localhost:8080/v1"
model = "clef-flash:9b-q8_0-8192"
# The server's real window per request, in tokens (at least 1024).
context_tokens = 8192
# timeout_secs = 30
# Requests in flight at once; match the server's slots.
# parallel = 1
# api_key = ""

# Decide's thresholds. The defaults are a time budget: tokens read, times 1.1 ms.
# [decide]
# Tokens in the joint read's state (at least 256).
# joint_tokens = 2500
# A passage bears on the question from this probability.
# bears_min = 0.5
# A top probability from here is settled.
# settled_at = 0.80
# The share of bearing against the verdict that makes it split.
# split_at = 0.34

# Optional reranker; style is "tei", "cohere" or "vllm".
# [infer.rerank]
# base_url = "http://localhost:8001"
# model = "bge-reranker-v2-m3"
# style = "tei"
# Where it is consulted.
# apply = ["ask", "search"]

# Optional image reading; without it the image door is closed.
# [infer.vision]
# model = "qwen2.5-vl-7b"
# tier = "efficient"
# base_url = "http://localhost:8002/v1"
# api_key = ""
# timeout_secs = 120
# Never taken from a tier.
# max_output_tokens = 4096
# ceiling_param = "max_tokens"

# Optional dictation over POST {base_url}/audio/transcriptions; without it there is no microphone.
# [infer.transcribe]
# base_url = "http://localhost:8090/v1"
# model = "whisper-1"
# api_key = ""
# timeout_secs = 60
# ISO-639-1 code; unset detects from the audio, which is weak on short queries.
# language = "de"

[auth]
# "local" or "oidc".
mode = "local"

# Hash with: cargo run -- --hash-password 'your password'
[auth.local]
username = "dev"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$REPLACE_ME$REPLACE_ME"

# A subject must match one allow-list; all empty is refused unless open_registration.
# [auth.oidc]
# issuer_url = "https://idp.example/realms/main"
# client_id = "engram"
# client_secret = "..."          # prefer ENGRAM__AUTH__OIDC__CLIENT_SECRET
# scopes = ["openid", "profile", "email"]
# Lets any subject the provider admits create a base here.
# open_registration = false
# allowed_subs = ["sub-abc123"]
# Needs the provider to send a `groups` claim.
# allowed_groups = ["engram-users"]

[consolidate]
# The background duplicate sweep; capture-time detection is always on.
enabled = true
# Shingle overlap above which a capture is parked as a near-duplicate (measured: 0.79 vs 0.04).
near_dupe_min = 0.60
# Cosine floor for putting a pair to the judge; the idle pass moves it.
review_min = 0.88
# Pairs at or above this are judged first.
auto_supersede = 0.95
# Neighbours considered per artifact.
per_point = 5
interval_hours = 24
# Model calls per dedupe tick, every interval; max_dedupe_per_tick = 0 turns the model off.
dedupe_interval_mins = 15
max_dedupe_per_tick = 5

[feedback]
# Candidates stored per recorded search.
candidates = 20
# Rewordings inside this window fold into one search; 0 turns folding off.
coalesce_secs = 5
# Days an unjudged search is kept; 0 keeps them.
retain_days = 0
sweep_hours = 6
# Share of searches that lift one just-missed candidate into the last row.
explore = 0.1

[associate]
# Replay interval for the search log; no model call.
interval_mins = 30
# Half-life of an unused link, in uses.
half_life_days = 30
# Unjudged links below this are forgotten.
prune_below = 0.5
show_min = 2.0
judge_min = 4.0
# Distinct questions a link needs before it is judged.
judge_min_queries = 3
judge_per_sweep = 10
# Top hits asked for links, and associated hits appended after the list.
spread_from = 3
spread_max = 3
# Margin and places for priming by use; prime_lift = 0 turns it off.
prime_margin = 0.5
prime_lift = 1

[activation]
half_life_days = 14
# Being listed is exposure, not use.
retrieved = 0.0
opened = 1.0
confirmed = 3.0
# An answer's citation; a model's use, so weighed like an open.
cited = 0.5

[promote]
# Activation a passage needs to earn a synthesis call.
activation_above = 3.0
# Cosine at which a rewrite supersedes the passage it came from; above 1.0 turns it off.
traceable_min = 0.75

[pursuit]
# A pursuit ends after this much quiet.
idle_secs = 900
# Fewer engaged artifacts is a promotion case.
min_sources = 2
# Engagement a pursuit needs before it is worth a call.
min_engagement = 3.0

# The offer under the search box, learned from the situation pages are opened in.
[recommend]
# Also arms the sweep that ages recorded situations out.
enabled = true
cluster_merge_at = 0.82
# Situations kept per artifact, per person.
max_clusters = 5
half_life_days = 45.0
# Clusters lighter than this are dropped.
min_weight = 0.9
# Weight at which a situation is called established.
firm_at = 2.5
# Scores for "pattern" and "resemblance"; below both, a random card.
strong_at = 0.75
weak_at = 0.45
# Weight of opens of something this offered; 0 keeps it from teaching itself.
self_weight = 0.0

# Each block is normalised, then scaled by its weight.
[recommend.weights]
time_of_day = 1.0
weekday = 1.0
weekend = 0.3
device = 0.8
viewport = 0.4
locale = 0.3
network = 0.6
power = 0.2
environment = 0.2
month_cycle = 0.0

[sitting]
# Let what this sitting touched lift a result; needs associate.prime_lift above 0.
prime = true

[time]
# Due reminders inside this window show on the front page.
horizon_hours = 48
# Dates inside this many days are listed under "Coming up".
coming_up_days = 7
# An open due reminder lifts a hit, bounded.
lift = true
# IANA zone for doors that send none; empty is the server's own.
default_tz = ""

# Buries retired artifacts the live base already covers; the only stage that wipes captured text.
[reap]
# Runs only when this section is written.
enabled = true
interval_mins = 1440
# Days retired before an artifact is judged.
min_age_days = 90
# Model calls per run.
max_judged_per_run = 20
# Rewrites per run.
max_rescues_per_run = 3

[schedule]
# Background work waiting longer than this becomes foreground.
age_after_mins = 60
# Ceiling for the backoff of a sweep that keeps finding nothing.
# backoff_max_hours = 24

[pacing]
# Seconds between background generations; 0 disables. Ask and embedding ignore it.
cooldown_secs = 0

[evolve]
# A search nobody opened, then another inside this window, counts as a weak negative; 0 turns it off.
give_up_window_secs = 300
# Corpus actions each job may take per 24 hours; 0 stops them.
max_actions_per_day = 20
# Quiet seconds before the base sleeps.
idle_secs = 1800

[capture]
# Seconds a server-side fetch may take.
fetch_timeout_secs = 30
# Bytes read from a fetched URL.
fetch_max_bytes = 8388608
# Extractions shorter than this are refused as a login wall or banner.
min_extracted_chars = 200
image_max_bytes = 26214400
pdf_max_bytes = 52428800
# Longest edge of the preview; the original is stored untouched.
image_preview_edge = 2048

[ui.background]
# The point cloud behind the pages; decorative.
enabled = true
# Vectors sampled per snapshot; capped at 20000.
sample_size = 2000
