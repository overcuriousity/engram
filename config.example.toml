[server]
bind = "127.0.0.1:8080"
workers = 1

[store]
path = "engram.db"

[vector]
url = "http://localhost:6333"
collection = "artifacts"

recency_weight = 0.05
recency_half_life_days = 180
pinned_boost = 0.15

[infer.synthesize]
base_url = "http://localhost:8000/v1"
model = "qwen"
context_tokens = 32768
max_output_tokens = 16384
output_ratio = 8.0

[infer.embed]
base_url = "http://localhost:8000/v1"
model = "bge-m3"
timeout_secs = 120
dim = 1024
max_input_tokens = 1024

[infer.ask]
base_url = "http://localhost:8000/v1"
model = "qwen"
context_tokens = 32768

[auth]
mode = "local"

[auth.local]
username = "dev"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$REPLACE_ME$REPLACE_ME"

[consolidate]
enabled = true
near_dupe_min = 0.90
review_min = 0.88
auto_supersede = 0.95
sample = 2000
per_point = 5
interval_hours = 24
judge = false
max_judgements = 20
