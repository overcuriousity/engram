<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="engram">
  <title>engram</title>
  <!--
    The home-screen icon: the mark of logo.svg on an opaque ground.

    Two differences from the logo, both forced by where this is shown. The ink
    is literal rather than `currentColor`, because a launcher rasterizes this
    outside any document and outside any scheme — one fixed pair, dark ground,
    light mark. And the mark is scaled to 62% of the square so it survives a
    maskable crop: a launcher may cut this to a circle, keeping the central
    80%, so anything nearer the edge is not guaranteed to be seen.

    The PNGs beside this file are committed rather than generated, because a
    build must not need a rasterizer installed. Regenerate them after editing:

      rsvg-convert -w 192 -h 192 assets/icon.svg -o assets/icon-192.png
      rsvg-convert -w 512 -h 512 assets/icon.svg -o assets/icon-512.png
      rsvg-convert -w 180 -h 180 assets/icon.svg -o assets/apple-touch-icon.png
  -->
  <rect width="512" height="512" fill="#0e1015"/>

  <g transform="translate(97.28 97.28) scale(4.96)">
    <g fill="none" stroke="#e8eaf0" stroke-width="2" stroke-linecap="round">
      <line x1="32" y1="32" x2="18" y2="24"/>
      <line x1="32" y1="32" x2="46" y2="26"/>
      <line x1="32" y1="32" x2="28" y2="48"/>
    </g>
    <g fill="#e8eaf0">
      <circle cx="18" cy="24" r="3.5"/>
      <circle cx="46" cy="26" r="3.5"/>
      <circle cx="28" cy="48" r="3.5"/>
      <circle cx="32" cy="32" r="6"/>
    </g>
    <g fill="#e8eaf0" opacity="0.3">
      <circle cx="55" cy="52" r="2"/>
      <circle cx="40" cy="7"  r="2"/>
      <circle cx="7"  cy="45" r="2"/>
    </g>
  </g>
</svg>
