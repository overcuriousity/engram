<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The mark at tab size. One colour, chosen from the browser chrome's
       scheme because a favicon inherits nothing. -->
  <style>
    :root { color: #1c1e24 }
    @media (prefers-color-scheme: dark) { :root { color: #e8eaf0 } }
  </style>

  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="18" y2="24"/>
    <line x1="32" y1="32" x2="46" y2="26"/>
    <line x1="32" y1="32" x2="28" y2="48"/>
  </g>
  <g fill="currentColor">
    <circle cx="18" cy="24" r="4"/>
    <circle cx="46" cy="26" r="4"/>
    <circle cx="28" cy="48" r="4"/>
    <circle cx="32" cy="32" r="6.5"/>
  </g>
  <g fill="currentColor" opacity="0.3">
    <circle cx="55" cy="52" r="2.5"/>
    <circle cx="40" cy="7"  r="2.5"/>
    <circle cx="7"  cy="45" r="2.5"/>
  </g>
</svg>
