<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="engram">
  <title>engram</title>
  <!--
    The mark is the mechanism: a query point in latent space with its nearest
    neighbours bound to it, and more distant points left unconnected. The
    geometry is to scale — bound nodes ~16 units from centre, loose ones 26-30.
    Read a second way it is a neuron: soma, dendrites, and the field it hears.

    One colour, `currentColor`, and hierarchy carried by size and opacity
    alone. Standalone the file picks its own ink from the system scheme; the
    copy inlined in `layout.html` inherits the page's, so it follows the theme
    toggle too. Nothing here needs a light or a dark variant.
  -->
  <style>
    :root { color: #1c1e24 }
    @media (prefers-color-scheme: dark) { :root { color: #e8eaf0 } }
  </style>

  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="32" x2="18" y2="24"/>
    <line x1="32" y1="32" x2="46" y2="26"/>
    <line x1="32" y1="32" x2="28" y2="48"/>
  </g>
  <g fill="currentColor">
    <circle cx="18" cy="24" r="3.5"/>
    <circle cx="46" cy="26" r="3.5"/>
    <circle cx="28" cy="48" r="3.5"/>
    <circle cx="32" cy="32" r="6"/>
  </g>
  <g fill="currentColor" opacity="0.3">
    <circle cx="55" cy="52" r="2"/>
    <circle cx="40" cy="7"  r="2"/>
    <circle cx="7"  cy="45" r="2"/>
  </g>
</svg>
