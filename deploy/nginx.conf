# nginx in front of engram on the same host. engram sets every security header; add none here.
# Replace engram.example.org and the certificate paths, and set server.public_url to match.

server {
    listen 80;
    listen [::]:80;
    server_name engram.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name engram.example.org;

    ssl_certificate     /etc/ssl/certs/engram.example.org.pem;
    ssl_certificate_key /etc/ssl/private/engram.example.org.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # PDFs may be 50 MB; see capture.pdf_max_bytes.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-sent events: the live channel and streamed answers must not be buffered.
    location ~ ^/(ui/live|ui/ask/|api/v1/ask/stream) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
