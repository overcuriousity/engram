# cargo-audit configuration.
#
# Advisories are ignored one id at a time, never by package or wholesale, and
# every entry carries the reachability argument that justifies it. If you cannot
# write that argument, fix the dependency instead of adding a line here.

[advisories]
ignore = [
  # RUSTSEC-2023-0071 — "Marvin Attack" timing sidechannel in `rsa` 0.9.x.
  # Reached via: engram -> openidconnect 4.0.1 -> rsa 0.9.10.
  # No patched release exists upstream.
  #
  # Not reachable in this codebase. The attack recovers an RSA *private* key by
  # observing timing during decryption or signing. engram performs neither:
  #
  #   * ID tokens are *verified* using the identity provider's public key
  #     (src/auth/oidc.rs, `id_token.claims(&client.id_token_verifier(), ...)`).
  #     Verification is a public-key operation; there is no private key held by
  #     this process for an attacker to recover.
  #   * Client authentication uses `client_secret`, not `private_key_jwt`, so no
  #     RSA private key is configured or used anywhere in the OIDC flow.
  #   * TLS is handled by rustls (aws-lc-rs), not by this crate.
  #
  # Re-review if any of the following becomes true:
  #   * openidconnect ships a release depending on a fixed `rsa`, at which point
  #     this entry should be deleted rather than carried forward.
  #   * engram starts using `private_key_jwt` client authentication, or signs
  #     anything with RSA. Then the advisory becomes live and must be fixed.
  "RUSTSEC-2023-0071",

  # RUSTSEC-2026-0194 — quadratic duplicate-attribute check in `quick-xml`.
  # RUSTSEC-2026-0195 — unbounded namespace allocation in `quick-xml`'s
  # `NsReader`.
  # Both reached via: engram -> docling 1.14.0 -> calamine 0.26.1 -> quick-xml
  # 0.31.0. Both are CPU/memory exhaustion on a thread parsing untrusted XML.
  #
  # Not reachable in this codebase. `quick-xml` appears twice in `Cargo.lock`:
  # docling's own direct dependency is already 0.41.0, which is the patched
  # version. The 0.31.0 copy belongs to `calamine`, which docling uses for
  # exactly three things — its `.xls`, `.xlsx` and `.xlsb` backends
  # (`src/backend/xls.rs`, `src/backend/xlsx.rs`). Nothing else in docling
  # names it.
  #
  # engram never reaches those backends. `src/core/pdf.rs` is the only place
  # docling is named at all, and it builds its source with
  # `SourceDocument::from_bytes(.., docling::InputFormat::Pdf, ..)`.
  # `from_bytes` stores the format it is handed without detection, and
  # docling's converter dispatches on `match source.format`, so the
  # spreadsheet arms are dead for us. Its one content-sniffing path
  # (`sniff_xml`) applies only to `Md`- and `Xml`-typed sources and can return
  # only the four XML formats — never a spreadsheet.
  #
  # No fix is available short of a fork. docling requires `calamine = "0.26"`,
  # 0.26.1 is the newest release in that range, and every calamine that moved
  # to a patched `quick-xml` is a later incompatible major (0.36.1 at the time
  # of writing). A `[patch.crates-io]` entry would still have to satisfy
  # `^0.26`, so it would mean maintaining a fork of a spreadsheet reader whose
  # code this application never executes.
  #
  # Re-review if any of the following becomes true:
  #   * docling ships a release whose `calamine` requirement admits a patched
  #     `quick-xml`, at which point both entries should be deleted rather than
  #     carried forward.
  #   * engram passes docling any `InputFormat` other than `Pdf`, or starts
  #     using `SourceDocument::from_path`, which picks the format from the
  #     file extension and can therefore select a spreadsheet backend. Then
  #     both advisories become live and must be fixed.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

# Informational advisories still surface in the log. `paste` (via tokenizers) is
# currently flagged unmaintained; that is worth seeing, not worth failing on,
# and it is not silenced here.
informational_warnings = ["unmaintained", "unsound", "notice"]

# Advisories that name a platform this application does not run on.
#
# A standing filter rather than a list of ids, which the policy above otherwise
# rules out — so the argument for it, once, here. `Cargo.lock` resolves every
# target cargo can build for, not the one we deploy: `windows-sys`, `schannel`
# and their kin are in it because `tokio`, `clap` and `reqwest` declare them
# under `cfg(windows)`. Nothing downloads or compiles them here, and every
# runner in ci.yml is ubuntu-latest. An advisory against one of them would fail
# this check over code that cannot execute.
#
# This is the same reachability argument the entry above makes, made once for a
# platform instead of once per id, and it is the only form of it allowed here.
# It filters narrowly: only advisories that declare an affected OS are dropped,
# and most declare none — those still fail, as they should.
[target]
os = ["linux"]
