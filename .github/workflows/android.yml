name: android
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      # ubuntu-latest ships an SDK at $ANDROID_HOME; AGP fetches the platform
      # and build-tools it needs, given the licences are accepted. The
      # setup-android action is not used: it runs `sdkmanager tools`, a
      # package that no longer exists, and fails before the build starts.
      - name: accept SDK licences
        run: yes | "$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - run: cd android && ./gradlew :core:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      # ubuntu-latest ships an SDK at $ANDROID_HOME; AGP fetches the platform
      # and build-tools it needs, given the licences are accepted. The
      # setup-android action is not used: it runs `sdkmanager tools`, a
      # package that no longer exists, and fails before the build starts.
      - name: accept SDK licences
        run: yes | "$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: cd android && ./gradlew :core:connectedDebugAndroidTest :app:connectedDebugAndroidTest --no-daemon
