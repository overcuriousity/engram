name: android
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      # ubuntu-latest ships an SDK at $ANDROID_HOME; AGP fetches the platform
      # and build-tools it needs, given the licences are accepted. The
      # setup-android action is not used: it runs `sdkmanager tools`, a
      # package that no longer exists, and fails before the build starts.
      - name: accept SDK licences
        run: yes | "$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      # `assembleRelease` is here for R8: the release build strips and rewrites
      # what the debug build ships whole, and Room, kotlinx.serialization and
      # Compose all have corners it can take away. Finding that out on a
      # release is finding it out in front of everyone. Unsigned — the key
      # lives in the release workflow and nowhere near a pull request.
      - run: cd android && ./gradlew :core:lintDebug :app:lintDebug :core:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            android/core/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.html
      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      # ubuntu-latest ships an SDK at $ANDROID_HOME; AGP fetches the platform
      # and build-tools it needs, given the licences are accepted. The
      # setup-android action is not used: it runs `sdkmanager tools`, a
      # package that no longer exists, and fails before the build starts.
      - name: accept SDK licences
        run: yes | "$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: cd android && ./gradlew :core:connectedDebugAndroidTest :app:connectedDebugAndroidTest --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: |
            android/core/build/reports/androidTests/
            android/core/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
