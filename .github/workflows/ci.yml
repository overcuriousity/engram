name: ci

on:
  push:
  pull_request:

# A newer push makes an in-flight run irrelevant. Cancelling keeps queue times
# down without weakening what lands on the default branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Note: deliberately NOT setting `RUSTFLAGS: -D warnings` globally. It would
  # apply to dependency compilation too, so any warning in a third-party crate
  # would fail our build. Our own code is held to -D warnings via clippy below.

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Everything here runs without infrastructure: inference roles and the
      # vector store sit behind traits with deterministic fakes.
      - run: cargo test --locked

  contained:
    name: contained feature
    runs-on: ubuntu-latest
    # The phone's core: llama.cpp and whisper.cpp in process, off by default
    # and so compiled by nothing above. The tests that want model files skip
    # themselves where `ENGRAM_TEST_MODELS` is unset; what this proves is that
    # the feature builds, lints and passes everything else.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: contained
      # For the bindings llama.cpp's crate generates; cmake is on the runner.
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: cargo clippy --features contained --all-targets --locked -- -D warnings
      - run: cargo test --features contained --lib --locked

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned to the version README and Cargo.toml promise. The floor is set
      # by sqlx 0.9, which requires 1.94 — higher than the 1.88 our own
      # let-chains need. This job is what stops that promise drifting silently.
      - uses: dtolnay/rust-toolchain@dc08e2af391d489dff6d14cf743e574f7d1229c5 # 1.94.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: msrv
      - run: cargo check --all-targets --locked

  integration:
    name: qdrant integration
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/ >/dev/null && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" >&2
          exit 1
      - run: cargo test --locked --test integration_qdrant -- --ignored
        env:
          ENGRAM_TEST_QDRANT: http://localhost:6333

  browser:
    name: browser layout
    runs-on: ubuntu-latest
    # The `#[ignore]`d tests in `web::mod`, `web::ui` and `tests/browser_ask`
    # need a real headless Chrome, so they cannot ride the `check` job. They
    # were written, wired to `tests/browser/page_width.js`, and then run by
    # nobody: `cargo test --locked` skips them by name and the only `--ignored`
    # line in this file names the Qdrant suite. A layout guard that never runs
    # is a layout guard that is already failing and does not say so.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      # `test_support::chrome` looks for playwright's own build under
      # ~/.cache/ms-playwright, which is what this installs.
      - run: npx --yes playwright install --with-deps chromium-headless-shell
      - run: cargo test --locked --lib -- --ignored
      - run: cargo test --locked --test browser_ask -- --ignored

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  manifest:
    name: oc-check, shellcheck, JS modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      # On the source checkout, before any build writes assets/app.css (which includes the tokens).
      - run: cargo install --git https://github.com/overcuriousity/overcuriousity-dev-manifest --tag v2026.11.1 oc-check --locked
      - run: oc-check .
      - run: shellcheck install.sh build-lowmem.sh extension/pack.sh scripts/*.sh
      - run: node --test assets/js/*.test.mjs
      - run: sh scripts/test-stamp-changelog.sh
