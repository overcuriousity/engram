[package]
name = "pkdb"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "pkdb"
path = "src/lib.rs"

[[bin]]
name = "pkdb"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
config = { version = "0.15.25", features = ["toml"] }
thiserror = "2.0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
async-trait = "0.1.92"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }
qdrant-client = "1.19.0"
pulldown-cmark = "0.13.4"
ammonia = "4.1.4"
argon2 = { version = "0.5.3", features = ["std", "password-hash"] }
base64 = "0.22"
openidconnect = "4.0.1"
rust-embed = "8.12.0"
mime_guess = "2"
askama = "0.16.0"
rmcp = { version = "3.1.2", features = ["server", "transport-streamable-http-server"] }
schemars = "1.2.2"

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"
wiremock = "0.6.5"
