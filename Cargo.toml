[package]
name = "engram"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[lib]
name = "engram"
path = "src/lib.rs"

[[bin]]
name = "engram"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
config = { version = "0.15.25", features = ["toml"] }
thiserror = "2.0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
anyhow = "1"
async-trait = "0.1.92"
# One ask is a sequence of events, written as straight-line async code. The
# alternative is a hand-written state machine over the same control flow, which
# is the same logic in a form nobody can read against the blocking door.
async-stream = "0.3"
# The `Stream` trait itself (a re-export of `futures-core`'s) and `next()`.
# Already in the tree by way of axum and sqlx; named here because this uses it
# directly.
tokio-stream = "0.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "stream"] }
pulldown-cmark = "0.13.4"
ammonia = "4.1.4"
argon2 = { version = "0.5.3", features = ["std", "password-hash"] }
base64 = "0.23"
openidconnect = "4.0.1"
rust-embed = "8.12.0"
mime_guess = "2"
askama = "0.16.0"
rmcp = { version = "3.1.2", features = ["server", "transport-streamable-http-server"] }
# Readability: strips navigation, headers, footers and asides, leaving the
# article. Hand-rolling these heuristics would be worse code than importing an
# implementation of them.
dom_smoothie = "0.18.0"
# HTML → markdown. A turndown.js port, and it replaced `html2md` for a measured
# reason rather than a fashionable one: on identical readability output
# `html2md` recovered no ATX headings at all from several ordinary sites — none
# against this crate's 38 on a BBC front page, none against 7 on a GitHub
# repository page — and `src/infer/split.rs` splits on headings before anything
# else. It also serialised `<sup>`, `<sub>` and geometry-bearing `<img>` back
# into the corpus verbatim, which came to 43% of the stored bytes of a
# Wikipedia article. Also pre-1.0; the fallback if that becomes unacceptable is
# still plain-text extraction, which costs the splitter its heading boundaries.
htmd = "0.5.5"
# What htmd builds its DOM from, named here for the one handler that reads
# an anchor's parent and siblings. No new build: htmd already pulls it in.
markup5ever_rcdom = "0.38"
# Decoding fetched pages that are not UTF-8. Already in the tree by way of
# the HTML crates; named here because this uses it directly.
encoding_rs = "0.8.35"
# PDF → markdown. The layout work is docling's; the alternative is lopdf plus
# hand-written column and heading heuristics, which is marker's job description.
# Pinned exactly: 1.x is days old. The fallback if it becomes unacceptable is
# pdf-extract, which costs the splitter its heading boundaries.
#
# `pdf-text` is the pure-Rust rung: no ONNX runtime, no native libraries, no
# models to fetch. `--features pdf-ml` swaps in the layout and table models for
# anyone who wants them; nothing in this tree assumes they are there.
docling = { version = "=1.18.1", default-features = false, features = ["pdf-text"] }

url = "2"
# Rewriting config.toml in place when a tuning recommendation is applied.
# `config` reads the file and cannot write it; a serialize-and-overwrite would
# return the operator's commented file as a machine's, so the edit is made to
# the parsed document and every byte around it is kept.
toml_edit = "0.25.13"
schemars = "1.2.2"
# Decoding, orientation and the downscaled preview of a captured image. Only
# the three formats a phone or a browser actually hands over.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# EXIF is where the phone says when and where a photo was taken.
kamadak-exif = "0.6.1"
# Local time, so "Friday at 15:00" is a question the base can ask of its own
# log. Storage stays Unix seconds; this is only ever applied at the edge.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The IANA database, because the zone comes from the device
# (`Intl.DateTimeFormat().resolvedOptions().timeZone`) and a stored offset
# cannot answer what happens across a DST boundary.
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
crossterm = "0.29.0"

[dev-dependencies]
# `test-util` is not part of tokio's `full`. It carries the pausable clock the
# gate's tests run on, so a cooldown is asserted exactly rather than slept
# through.
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tempfile = "3"
temp-env = "0.3"
wiremock = "0.6.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "stream"] }

[build-dependencies]
# Packs the Chrome extension at compile time. A build dependency, not a
# runtime one: the zip is a build artifact, not something the server assembles
# per request.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
default = []
pdf-ml = ["docling/pdf"]
