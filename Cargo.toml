[package]
name = "engram"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[lib]
name = "engram"
path = "src/lib.rs"

[[bin]]
name = "engram"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
config = { version = "0.15.25", features = ["toml"] }
thiserror = "2.0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
anyhow = "1"
async-trait = "0.1.92"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }
pulldown-cmark = "0.13.4"
ammonia = "4.1.4"
argon2 = { version = "0.5.3", features = ["std", "password-hash"] }
base64 = "0.23"
openidconnect = "4.0.1"
rust-embed = "8.12.0"
mime_guess = "2"
askama = "0.16.0"
rmcp = { version = "3.1.2", features = ["server", "transport-streamable-http-server"] }
# Readability: strips navigation, headers, footers and asides, leaving the
# article. Hand-rolling these heuristics would be worse code than importing an
# implementation of them.
dom_smoothie = "0.18.0"
# HTML → markdown. Pre-1.0, and the fallback if that becomes unacceptable is
# plain-text extraction, which costs the splitter its heading boundaries.
html2md = "0.2.15"
# Decoding fetched pages that are not UTF-8. Already in the tree by way of
# the HTML crates; named here because this uses it directly.
encoding_rs = "0.8.35"
url = "2"
schemars = "1.2.2"
# Decoding, orientation and the downscaled preview of a captured image. Only
# the three formats a phone or a browser actually hands over.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# EXIF is where the phone says when and where a photo was taken.
kamadak-exif = "0.6.1"

[dev-dependencies]
# `test-util` is not part of tokio's `full`. It carries the pausable clock the
# gate's tests run on, so a cooldown is asserted exactly rather than slept
# through.
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tempfile = "3"
temp-env = "0.3"
wiremock = "0.6.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }

[build-dependencies]
# Packs the Chrome extension at compile time. A build dependency, not a
# runtime one: the zip is a build artifact, not something the server assembles
# per request.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
