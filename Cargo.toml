[package]
name = "pkdb"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
config = { version = "0.15.25", features = ["toml"] }
thiserror = "2.0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
async-trait = "0.1.92"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"
