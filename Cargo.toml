[package]
name = "engram"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/overcuriousity/engram"

[lib]
name = "engram"
path = "src/lib.rs"

[[bin]]
name = "engram"
path = "src/main.rs"

[[example]]
name = "contained"
required-features = ["contained"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "sensitive-headers"] }
# No `migrate` feature: `Store::migrate` / `Control::migrate` read a base's columns before touching it.
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
config = { version = "0.15.25", features = ["toml"] }
thiserror = "2.0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
anyhow = "1"
async-trait = "0.1.92"
# One ask is a sequence of events, written as straight-line async code.
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
# `blocking`: the boot-time tokenizer download; `multipart`: the speech endpoint's OpenAI form shape.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "stream", "blocking", "multipart"] }
pulldown-cmark = "0.13.4"
ammonia = "4.1.4"
# LaTeX to MathML on the server; 0.7 is the newest that builds on this rust-version.
math-core = "0.7.0"
argon2 = { version = "0.5.3", features = ["std", "password-hash"] }
base64 = "0.23"
openidconnect = "4.1.0"
rust-embed = "8.12.0"
mime_guess = "2"
askama = "0.16.0"
rmcp = { version = "3.1.2", features = ["server", "transport-streamable-http-server"] }
# Readability: strips the page chrome, leaving the article.
dom_smoothie = "0.19.0"
# HTML to markdown; `html2md` lost the ATX headings `src/infer/split.rs` splits on first.
htmd = "0.5.5"
# htmd's own version, not ours to bump: a second copy's `NodeData` is a different type.
markup5ever_rcdom = "0.38"
# Decoding fetched pages that are not UTF-8.
encoding_rs = "0.8.35"
# PDF to markdown, pinned exactly; `pdf-text` is the pure-Rust rung, `--features pdf-ml` adds the models.
docling = { version = "=1.53.0", default-features = false, features = ["pdf-text"] }

url = "2"
ipnet = "2"
sd-notify = "0.5"
tower-sessions = "0.15"
tower-sessions-sqlx-store = { version = "0.16", features = ["sqlite"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }

# The pairing QR as inline SVG; default features off, since `image` only writes an unserved PNG.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

# RFC 8291/8292 Web Push in `src/jobs/webpush.rs`; `web-push-native` pinned a p256 hit by RUSTSEC-2026-0387.
p256 = { version = "0.14.0", features = ["ecdsa", "ecdh", "getrandom"] }
aes-gcm = "0.11.1"
hkdf = "0.13.0"
# Keeps the comments of a hand-edited endpoint file.
toml_edit = "0.25.13"
schemars = "1.2.2"
# Only the three formats a phone or a browser hands over.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# EXIF carries when and where a photo was taken.
kamadak-exif = "0.6.1"
# Local time, applied only at the edge; storage stays Unix seconds.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The zone comes from the device, and a stored offset cannot cross a DST boundary.
iana-time-zone = "0.1"
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
crossterm = "0.29.0"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
text-splitter = { version = "0.32", features = ["markdown"] }

# The contained build's vector index, pinned exactly; `libsqlite3-sys` must stay on sqlx's version.
sqlite-vec = { version = "=0.1.9", optional = true }
libsqlite3-sys = { version = "0.37", optional = true }
# CPU only (Android ships no OpenMP), pinned exactly: the C++ under it moves fast.
llama-cpp-2 = { version = "=0.1.156", default-features = false, optional = true }
# Direct, at the same pin, so build.rs gets DEP_LLAMA_GGML_CMAKE_DIR for whisper.cpp.
llama-cpp-sys-2 = { version = "=0.1.160", default-features = false, optional = true }
# Reads a recording and resamples it to Whisper's rate.
hound = { version = "3.5", optional = true }
rubato = { version = "5", optional = true }

[dev-dependencies]
# `test-util` gives the gate's tests a pausable clock.
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tempfile = "3"
temp-env = "0.3"
wiremock = "0.6.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "stream"] }
oc-check = { git = "https://github.com/overcuriousity/overcuriousity-dev-manifest", tag = "v2026.11.1" }

[build-dependencies]
# Packs the extension at compile time.
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
# Compiles the vendored whisper.cpp.
cc = { version = "1.2", features = ["parallel"], optional = true }

[features]
default = []
pdf-ml = ["docling/pdf"]
contained = [
    "dep:sqlite-vec",
    "dep:libsqlite3-sys",
    "dep:llama-cpp-2",
    "dep:llama-cpp-sys-2",
    "dep:hound",
    "dep:rubato",
    "dep:cc",
]

# docling 1.53.0 drops multi-unit ToUnicode `bfrange` destinations (engram#60); all four crates are
# patched because the workspace wires them by path. Drop for the first crates.io release with the fix.
[patch.crates-io]
docling = { git = "https://github.com/overcuriousity/docling.rs", rev = "73d773b49266314bff3bd089641bd579c3e6d6de" }
docling-core = { git = "https://github.com/overcuriousity/docling.rs", rev = "73d773b49266314bff3bd089641bd579c3e6d6de" }
docling-onnx = { git = "https://github.com/overcuriousity/docling.rs", rev = "73d773b49266314bff3bd089641bd579c3e6d6de" }
docling-pdf = { git = "https://github.com/overcuriousity/docling.rs", rev = "73d773b49266314bff3bd089641bd579c3e6d6de" }
